# Windows (.exe) ve macOS (Apple Silicon) masaüstü paketlerini derler.
# GitHub'da bir sürüm (Release) yayınlanınca ya da "v" ile başlayan bir etiket gönderilince
# paketler o sürüme eklenir; Actions sekmesinden elle de çalıştırılabilir (yalnızca artifact).
name: Masaüstü paketleri

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:  # sürüm oluşturmak hem "release" hem etiket olayı üretebilir: tek çalışma yeter
  group: masaustu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  paketle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ad: kumbara-windows
          - os: macos-latest
            ad: kumbara-macos-apple-silicon
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: python -m pip install ".[panel]" pyinstaller
      - name: Derle
        working-directory: paketleme
        run: pyinstaller kumbara.spec --noconfirm
      - name: Kısayollar (macOS)
        if: runner.os == 'macOS'
        working-directory: paketleme/dist/kumbara
        run: |
          echo "Paketteki kısayollar (göreli olmalı):"
          find . -type l -exec ls -l {} \; | head -40
          # Mutlak yol gösteren kısayol başka bilgisayarda kırılır: derlemeyi durdur
          if find . -type l -lname '/*' | grep -q .; then
            echo "HATA: mutlak kısayol var"; find . -type l -lname '/*' -exec ls -l {} \;; exit 1
          fi
      - name: Sıkıştır
        run: |
          cd paketleme/dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../../${{ matrix.ad }}.zip" kumbara > /dev/null
          else
            ditto -c -k --keepParent kumbara "../../${{ matrix.ad }}.zip"
          fi
      - name: Açılıyor mu? (zip'ten açılmış kopyada, boşluklu klasörde)
        env:
          BROWSER: none
          KUMBARA_VERI_DIZINI: ${{ runner.temp }}/kumbara-veri
        run: |
          HEDEF="$RUNNER_TEMP/indirilen dosyalar"
          mkdir -p "$HEDEF"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x "${{ matrix.ad }}.zip" -o"$HEDEF" > /dev/null
          else
            ditto -x -k "${{ matrix.ad }}.zip" "$HEDEF"
            ls -l "$HEDEF/kumbara/_internal/Python" || true
          fi
          cd "$HEDEF/kumbara"
          ./kumbara > "$RUNNER_TEMP/calisma.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8501/_stcore/health; then echo " hazır"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/calisma.log"; exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.ad }}
          path: ${{ matrix.ad }}.zip

  yayinla:
    needs: paketle
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: paketler
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notlar.md <<'NOTLAR'
          **Windows:** `kumbara-windows.zip` dosyasını indirip açın, klasördeki `kumbara.exe`'ye çift tıklayın.
          **macOS (Apple Silicon):** `kumbara-macos-apple-silicon.zip` dosyasını açın, klasördeki `kumbara`'ya çift tıklayın.
          Kurulum gerekmez; panel tarayıcınızda açılır. Ayrıntılar README'de ("Download the app").

          **Windows:** download `kumbara-windows.zip`, unzip it and double-click `kumbara.exe`.
          **macOS (Apple Silicon):** unzip `kumbara-macos-apple-silicon.zip` and double-click `kumbara` in the folder.
          No installation needed; the panel opens in your browser. See "Download the app" in the README.
          NOTLAR
          SURUM="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$SURUM" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$SURUM" paketler/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            if [ -z "$(gh release view "$SURUM" --repo "$GITHUB_REPOSITORY" --json body -q .body)" ]; then
              gh release edit "$SURUM" --repo "$GITHUB_REPOSITORY" --notes-file notlar.md
            fi
          else
            gh release create "$SURUM" paketler/*.zip --repo "$GITHUB_REPOSITORY" \
              --title "kumbara $SURUM" --notes-file notlar.md
          fi
