[project]
name = "kumbara"
version = "0.1.0"
description = "Personal finance assistant: card statement analysis, monthly savings, savings goals and goal-based portfolio suggestions, with live Turkish market data (CBRT, TEFAS, KAP)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "kumbara katkıcıları" }]
keywords = ["personal finance", "budget", "savings", "portfolio", "KAP", "TEFAS", "TCMB", "BIST"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Turkish",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "borsapy>=0.11",
]

[project.optional-dependencies]
panel = ["streamlit>=1.50", "plotly>=5.24", "kumbara[ocr]"]
# Ekran görüntüsü (dönem içi) okuma: macOS'ta Apple Vision, diğerlerinde Tesseract (ayrıca kurulur)
ocr = [
    "pillow>=10",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "pytesseract>=0.3.10",
]
dev = ["pytest>=8.0", "ruff>=0.6", "fpdf2>=2.8", "kumbara[ocr]"]

[project.scripts]
kumbara = "kumbara.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kumbara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ag: canlı ağ erişimi gerektiren testler (varsayılan olarak atlanır, -m ag ile çalıştırın)"]
addopts = "-m 'not ag'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Argument/Option varsayılanları typer'ın önerdiği kullanım
