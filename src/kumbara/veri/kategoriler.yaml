# Varsayılan kategori kuralları.
# Her kural: anahtar kelimeler (açıklamada geçerse eşleşir, Türkçe karakter/büyük-küçük harf fark etmez).
# Sıra önemlidir: ilk eşleşen kural kazanır, bu yüzden özel kurallar üstte olmalı.
# Anahtar kelimenin sonundaki ekler serbesttir (FAIZ → FAIZI). Sonu '$' ile biten anahtar tam
# kelimedir: 'TAKSI$' "TAKSİ"yi yakalar ama "TAKSİT"i yakalamaz.
# yon: "gider" (yalnız harcamalara), "gelir" (yalnız girişlere) veya "hepsi".
# zorunlu: gelecek ay bütçesinde kısılamayan (zorunlu) harcama mı?
# Kendi kurallarınızı ~/.kumbara/kategoriler.yaml dosyasına aynı biçimde yazarsanız bunların ÖNÜNE eklenir.

kurallar:
  - kategori: Taksitler
    yon: gider
    zorunlu: true
    anahtar: [BU DONEME AIT TAKSIT]
